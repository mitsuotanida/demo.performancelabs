<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
    <stop stop-color="#081627"/>
    <stop offset="1" stop-color="#0C2238"/>
  </linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#35D0F2"/>
    <stop offset="1" stop-color="#5AAEFF"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#13263D" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#0D1C2F" stop-opacity="0.95"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.28"/>
  </filter>
</defs>

<rect width="1600" height="900" rx="36" fill="url(#bg)"/>
<circle cx="1220" cy="90" r="220" fill="#3BCBEE" fill-opacity="0.06"/>
<circle cx="280" cy="140" r="260" fill="#5AAEFF" fill-opacity="0.05"/>

<!-- Track-inspired arcs -->
<path d="M-40 700C220 520 470 510 760 610" stroke="#32C8ED" stroke-opacity="0.14" stroke-width="10" stroke-linecap="round"/>
<path d="M-10 755C240 585 520 575 820 680" stroke="#32C8ED" stroke-opacity="0.09" stroke-width="8" stroke-linecap="round"/>
<path d="M40 805C290 645 580 640 900 748" stroke="#32C8ED" stroke-opacity="0.06" stroke-width="6" stroke-linecap="round"/>

<!-- Court/field guide lines -->
<rect x="72" y="84" width="1456" height="732" rx="28" stroke="#8CB2D9" stroke-opacity="0.10" stroke-width="2"/>
<path d="M160 720H850" stroke="#89A9D0" stroke-opacity="0.08" stroke-width="2"/>
<path d="M160 600H850" stroke="#89A9D0" stroke-opacity="0.08" stroke-width="2"/>
<path d="M160 480H850" stroke="#89A9D0" stroke-opacity="0.08" stroke-width="2"/>
<path d="M160 360H850" stroke="#89A9D0" stroke-opacity="0.08" stroke-width="2"/>

<!-- Main chart card -->
<g filter="url(#shadow)">
  <rect x="110" y="180" width="760" height="470" rx="28" fill="url(#card)" stroke="#9FB9DA" stroke-opacity="0.16"/>
  <text x="150" y="232" fill="#EAF2FF" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">Seguimiento por deportista, grupo y disciplina</text>
  <text x="150" y="270" fill="#9EC0E6" font-size="18" font-family="Arial, Helvetica, sans-serif">Indicadores integrados de rendimiento, carga y adherencia</text>

  <!-- Bar chart -->
  <rect x="158" y="485" width="52" height="100" rx="10" fill="#1A3551"/>
  <rect x="228" y="445" width="52" height="140" rx="10" fill="#21466B"/>
  <rect x="298" y="395" width="52" height="190" rx="10" fill="#2D5C8A"/>
  <rect x="368" y="348" width="52" height="237" rx="10" fill="url(#cyan)"/>
  <rect x="438" y="420" width="52" height="165" rx="10" fill="#2B537A"/>
  <rect x="508" y="380" width="52" height="205" rx="10" fill="#32648F"/>

  <!-- line chart -->
  <path d="M160 420C225 370 265 330 330 335C395 340 458 435 515 392C575 347 630 230 690 250C750 270 780 320 822 300" stroke="url(#cyan)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="160" cy="420" r="8" fill="#35D0F2"/>
  <circle cx="330" cy="335" r="8" fill="#35D0F2"/>
  <circle cx="515" cy="392" r="8" fill="#35D0F2"/>
  <circle cx="690" cy="250" r="8" fill="#35D0F2"/>
  <circle cx="822" cy="300" r="8" fill="#35D0F2"/>

  <!-- mini cards -->
  <rect x="590" y="462" width="226" height="88" rx="18" fill="#102438" stroke="#96BADF" stroke-opacity="0.14"/>
  <text x="616" y="497" fill="#9EC0E6" font-size="16" font-family="Arial, Helvetica, sans-serif">Riesgo de abandono</text>
  <text x="616" y="535" fill="#F6FBFF" font-size="34" font-family="Arial, Helvetica, sans-serif" font-weight="700">12%</text>

  <rect x="590" y="346" width="226" height="88" rx="18" fill="#102438" stroke="#96BADF" stroke-opacity="0.14"/>
  <text x="616" y="381" fill="#9EC0E6" font-size="16" font-family="Arial, Helvetica, sans-serif">Asistencia promedio</text>
  <text x="616" y="419" fill="#F6FBFF" font-size="34" font-family="Arial, Helvetica, sans-serif" font-weight="700">87%</text>
</g>

<!-- Right side KPI stack -->
<g filter="url(#shadow)">
  <rect x="960" y="172" width="514" height="146" rx="26" fill="url(#card)" stroke="#9FB9DA" stroke-opacity="0.16"/>
  <text x="1000" y="224" fill="#9EC0E6" font-size="18" font-family="Arial, Helvetica, sans-serif">Rendimiento agregado</text>
  <text x="1000" y="276" fill="#F6FBFF" font-size="54" font-family="Arial, Helvetica, sans-serif" font-weight="700">+18%</text>
  <text x="1215" y="276" fill="#35D0F2" font-size="22" font-family="Arial, Helvetica, sans-serif" font-weight="700">vs. mes anterior</text>
</g>

<g filter="url(#shadow)">
  <rect x="960" y="344" width="245" height="158" rx="24" fill="url(#card)" stroke="#9FB9DA" stroke-opacity="0.16"/>
  <text x="992" y="394" fill="#9EC0E6" font-size="18" font-family="Arial, Helvetica, sans-serif">Carga</text>
  <text x="992" y="453" fill="#F6FBFF" font-size="48" font-family="Arial, Helvetica, sans-serif" font-weight="700">82%</text>
  <path d="M992 470H1168" stroke="#2B425D" stroke-width="10" stroke-linecap="round"/>
  <path d="M992 470H1128" stroke="url(#cyan)" stroke-width="10" stroke-linecap="round"/>
</g>

<g filter="url(#shadow)">
  <rect x="1229" y="344" width="245" height="158" rx="24" fill="url(#card)" stroke="#9FB9DA" stroke-opacity="0.16"/>
  <text x="1261" y="394" fill="#9EC0E6" font-size="18" font-family="Arial, Helvetica, sans-serif">Adherencia</text>
  <text x="1261" y="453" fill="#F6FBFF" font-size="48" font-family="Arial, Helvetica, sans-serif" font-weight="700">91%</text>
  <circle cx="1410" cy="441" r="32" fill="#0F2941" stroke="#96BADF" stroke-opacity="0.18"/>
  <path d="M1392 441L1405 454L1428 429" stroke="#35D0F2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<g filter="url(#shadow)">
  <rect x="960" y="528" width="514" height="216" rx="28" fill="url(#card)" stroke="#9FB9DA" stroke-opacity="0.16"/>
  <text x="1000" y="580" fill="#F6FBFF" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="700">Indicadores deportivos conectados</text>
  <text x="1000" y="620" fill="#9EC0E6" font-size="18" font-family="Arial, Helvetica, sans-serif">Dashboards ejecutivos, KPIs y señales de mejora para entrenadores y dirección.</text>

  <!-- abstract athlete / motion -->
  <circle cx="1180" cy="666" r="26" fill="#35D0F2" fill-opacity="0.92"/>
  <path d="M1178 694C1149 724 1128 742 1106 772" stroke="#35D0F2" stroke-width="12" stroke-linecap="round"/>
  <path d="M1182 700C1218 720 1250 742 1286 758" stroke="#35D0F2" stroke-width="12" stroke-linecap="round"/>
  <path d="M1185 705C1160 664 1140 632 1120 595" stroke="#35D0F2" stroke-width="12" stroke-linecap="round"/>
  <path d="M1188 690C1232 676 1275 654 1326 620" stroke="#35D0F2" stroke-width="12" stroke-linecap="round"/>
  <path d="M1098 773H1344" stroke="#8CB2D9" stroke-opacity="0.15" stroke-width="3"/>
</g>
</svg>
