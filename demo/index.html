<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>entrenapp · Coach Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;background:#09090e;color:#e4e4ef;font-family:"Inter",system-ui,sans-serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#2e2e3a;border-radius:9999px}
.glow{box-shadow:0 0 0 1px rgba(255,255,255,0.04),0 8px 32px rgba(0,0,0,0.5)}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.ani{animation:fi 0.4s ease-out}
@keyframes pd{0%,100%{opacity:1}50%{opacity:0.3}}
.pdot{animation:pd 2s infinite}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const SPORTS=[{id:'tennis',label:'Tenis',icon:'🎾',color:'#f59e0b',accent:'#fbbf24'},{id:'football',label:'Fútbol',icon:'⚽',color:'#3b82f6',accent:'#60a5fa'},{id:'swimming',label:'Natación',icon:'🏊',color:'#06b6d4',accent:'#22d3ee'},{id:'gym',label:'Gimnasio',icon:'💪',color:'#8b5cf6',accent:'#a78bfa'}]
const ATHLETES=[{id:1,name:'Sofía Martínez',sport:'tennis',av:'SM',lvl:87,streak:14,badges:['🔥','⚡','🎯'],hrv:72,rec:89,trend:'up',sess:47,rank:1},{id:2,name:'Diego Herrera',sport:'football',av:'DH',lvl:74,streak:7,badges:['💨','🏆'],hrv:58,rec:65,trend:'down',sess:39,rank:3},{id:3,name:'Camila Rojas',sport:'swimming',av:'CR',lvl:92,streak:21,badges:['🔥','🌊','⚡','🎯','🏆'],hrv:81,rec:95,trend:'up',sess:63,rank:1},{id:4,name:'Mateo López',sport:'gym',av:'ML',lvl:61,streak:3,badges:['💪'],hrv:45,rec:52,trend:'flat',sess:28,rank:5},{id:5,name:'Valentina Cruz',sport:'tennis',av:'VC',lvl:78,streak:9,badges:['🔥','🎯'],hrv:68,rec:78,trend:'up',sess:41,rank:2},{id:6,name:'Andrés Silva',sport:'football',av:'AS',lvl:83,streak:12,badges:['💨','⚡','🏆'],hrv:74,rec:86,trend:'up',sess:55,rank:2}]
const HISTORY=[{w:"S1",s:58,l:42,r:71},{w:"S2",s:62,l:55,r:68},{w:"S3",s:61,l:61,r:63},{w:"S4",s:67,l:48,r:74},{w:"S5",s:71,l:53,r:78},{w:"S6",s:69,l:67,r:65},{w:"S7",s:75,l:58,r:80},{w:"S8",s:79,l:52,r:84}]
const RADAR=[{a:"Técnica",A:85,B:72},{a:"Velocidad",A:78,B:90},{a:"Resistencia",A:92,B:68},{a:"Fuerza",A:65,B:85},{a:"Mental",A:88,B:74},{a:"Recovery",A:95,B:65}]
const METRICS={
tennis:{stats:[{lbl:"Primer Servicio",val:"68%",delta:"+4%",good:true,unit:"efect."},{lbl:"Errores No Forz.",val:"12",delta:"-3",good:true,unit:"por set"},{lbl:"Vel. de Servicio",val:"187",delta:"+8",good:true,unit:"km/h"},{lbl:"Games Ganados",val:"61%",delta:"+3%",good:true,unit:""}],dirs:[{p:"high",icon:"\ud83c\udfaf",t:"Trabaja el segundo servicio",d:"El % de doble falta subi\u00f3 2pts. Enfoca 20min/sesi\u00f3n en kicker con spin para estabilizarlo."},{p:"medium",icon:"\u26a1",t:"Sube intensidad los martes",d:"Tu HRV sugiere capacidad sin usar. Los martes son perfectos para drills de alta intensidad."},{p:"low",icon:"\ud83e\udde0",t:"Explota la derecha cruzada",d:"En sets decisivos ganas el 78% con derecha cruzada. \u00dasala m\u00e1s conscientemente."}]},
football:{stats:[{lbl:"Distancia Total",val:"9.4",delta:"+0.6",good:true,unit:"km/partido"},{lbl:"Sprints >25km/h",val:"18",delta:"+3",good:true,unit:"por partido"},{lbl:"Precisi\u00f3n Pase",val:"84%",delta:"+2%",good:true,unit:""},{lbl:"Duelos Ganados",val:"61%",delta:"-1%",good:false,unit:""}],dirs:[{p:"high",icon:"\u26a0\ufe0f",t:"Recovery activo hoy",d:"Carga alta 3 d\u00edas seguidos. HRV baj\u00f3 13pts. Protocolo de recovery obligatorio."},{p:"medium",icon:"\ud83c\udfc3",t:"Mejora el arranque de sprint",d:"Los 10m iniciales est\u00e1n 0.3s bajo tu mejor marca. Trabaja aceleraciones explosivas."},{p:"low",icon:"\ud83d\udccd",t:"Posicionamiento defensivo",d:"Concedes espacio en transici\u00f3n. Revisar video de la sesi\u00f3n 3 con el equipo t\u00e9cnico."}]},
swimming:{stats:[{lbl:"SWOLF Score",val:"34",delta:"-2",good:true,unit:"crawl 50m"},{lbl:"Brazadas/Largo",val:"17",delta:"-1",good:true,unit:"avg"},{lbl:"Tiempo 100m",val:"1:02.4",delta:"-1.8s",good:true,unit:""},{lbl:"Efic. de Viraje",val:"91%",delta:"+3%",good:true,unit:""}],dirs:[{p:"high",icon:"\ud83c\udf0a",t:"Reduce brazadas en el fondo",d:"SWOLF mejora pero gastas energ\u00eda extra en los metros 25-75. Trabaja el deslizamiento post-brazada."},{p:"medium",icon:"\u23f1\ufe0f",t:"Series de pace control",d:"Arranques r\u00e1pidos seguidos de ca\u00edda de ritmo. Esta semana: 8x100m a ritmo uniforme estricto."},{p:"low",icon:"\ud83d\udca8",t:"Respiraci\u00f3n bilateral",d:"Respiras cada 2 brazadas bajo estr\u00e9s. El entrenamiento bilateral mejora simetr\u00eda y eficiencia."}]},
gym:{stats:[{lbl:"Volumen Semanal",val:"12,400",delta:"+800",good:true,unit:"kg totales"},{lbl:"RPE Promedio",val:"7.2",delta:"+0.4",good:true,unit:"/10"},{lbl:"1RM Squat Est.",val:"127",delta:"+4",good:true,unit:"kg"},{lbl:"Progresi\u00f3n Mens.",val:"+6.3%",delta:"",good:true,unit:"fuerza"}],dirs:[{p:"high",icon:"\u26a0\ufe0f",t:"Deload esta semana",d:"4 semanas de carga progresiva. HRV cay\u00f3 12pts. Reduce volumen 40% para supercompensaci\u00f3n."},{p:"medium",icon:"\ud83d\udcaa",t:"Prioriza movimientos compuestos",d:"Ratio compound/aislamiento es 40/60. Invertirlo aumenta est\u00edmulo hormonal y resultados."},{p:"low",icon:"\ud83d\ude34",t:"Optimiza el sue\u00f1o pre-sesi\u00f3n",d:"Tus mejores sesiones correlacionan con +7.5h de sue\u00f1o. Prep\u00e1rate 30min antes del onset."}]},
}
const LBOARD=[{r:1,n:"Camila Rojas",sp:"swimming",pts:4280,ico:"\ud83c\udfc6",d:"+120"},{r:2,n:"Sof\u00eda Mart\u00ednez",sp:"tennis",pts:3950,ico:"\ud83e\udd48",d:"+85"},{r:3,n:"Andr\u00e9s Silva",sp:"football",pts:3720,ico:"\ud83e\udd49",d:"+210"},{r:4,n:"Valentina Cruz",sp:"tennis",pts:3340,ico:"\u2b50",d:"+45"},{r:5,n:"Diego Herrera",sp:"football",pts:2980,ico:"\u2b50",d:"-30"},{r:6,n:"Mateo L\u00f3pez",sp:"gym",pts:2540,ico:"\u2b50",d:"+95"}]

const {useState,useEffect}=React
const {AreaChart,Area,XAxis,YAxis,Tooltip,ResponsiveContainer,CartesianGrid,RadarChart,Radar,PolarGrid,PolarAngleAxis}=Recharts
const cx=(...a)=>a.filter(Boolean).join(' ')
const rColor=r=>r>=80?'#34d399':r>=60?'#fbbf24':'#f87171'
const rTxt=r=>r>=80?'text-emerald-400':r>=60?'text-yellow-400':'text-red-400'
const rBg=r=>r>=80?'bg-emerald-500/10 border-emerald-500/20':r>=60?'bg-yellow-500/10 border-yellow-500/20':'bg-red-500/10 border-red-500/20'
const sColor=s=>s>=85?'text-emerald-400':s>=70?'text-yellow-400':'text-red-400'

function Av({t,sz='md',g='from-blue-500 to-violet-600'}){
  const s=sz==='lg'?'w-10 h-10 text-xs':sz==='sm'?'w-6 h-6 text-[9px]':'w-8 h-8 text-xs'
  return <div className={cx('rounded-full bg-gradient-to-br flex items-center justify-center font-bold text-white shrink-0',g,s)}>{t}</div>
}
function Arc({val,max=100,color,sz=88,sw=7}){
  const r=(sz-sw)/2,c=2*Math.PI*r,d=c*(Math.min(val/max,1))
  return(<svg width={sz} height={sz} style={{transform:'rotate(-90deg)'}}>
    <circle cx={sz/2} cy={sz/2} r={r} fill="none" stroke="#1e1e2a" strokeWidth={sw}/>
    <circle cx={sz/2} cy={sz/2} r={r} fill="none" stroke={color} strokeWidth={sw}
      strokeDasharray={`${d} ${c-d}`} strokeLinecap="round" style={{transition:'stroke-dasharray 1s ease'}}/>
  </svg>)
}
function Card({children,className=''}){
  return <div className={cx('bg-[#111118] border border-[#1e1e2a] rounded-xl glow hover:border-[#272737] transition-all',className)}>{children}</div>
}
function Tip({active,payload,label}){
  if(!active||!payload?.length)return null
  return(<div className="bg-[#18181f] border border-[#2a2a38] rounded-lg px-3 py-2.5 shadow-2xl">
    <p className="text-[10px] text-zinc-400 mb-1.5 font-medium">{label}</p>
    {payload.map((p,i)=>(<div key={i} className="flex items-center gap-2 mb-0.5 text-[11px]">
      <span className="w-2 h-2 rounded-full" style={{background:p.color}}/>
      <span className="text-zinc-300">{p.name==='s'?'Rendimiento':p.name==='r'?'Recovery':'Carga'}</span>
      <span className="font-bold text-white ml-1">{p.value}</span>
    </div>))}
  </div>)
}

function Sidebar({view,setView,sport,setSport}){
  const nav=[{id:'dashboard',label:'Dashboard'},{id:'athletes',label:'Atletas'},{id:'sessions',label:'Sesiones'},{id:'ranking',label:'Ranking'}]
  return(<aside className="w-52 shrink-0 flex flex-col bg-[#0b0b11] border-r border-[#191923] h-full">
    <div className="px-4 py-5 border-b border-[#191923]">
      <div className="flex items-center gap-2.5">
        <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-blue-500 to-violet-600 flex items-center justify-center text-white text-sm font-bold shadow-lg">⚡</div>
        <span className="font-extrabold text-white tracking-tight">entrenapp</span>
      </div>
      <p className="text-[10px] text-zinc-600 mt-1 ml-9">Coach dashboard</p>
    </div>
    <nav className="flex-1 px-2.5 py-4 space-y-0.5">
      <p className="text-[9px] font-bold text-zinc-700 uppercase tracking-widest px-2 mb-2">General</p>
      {nav.map(({id,label})=>(<button key={id} onClick={()=>setView(id)}
        className={cx('w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium transition-all',
          view===id?'bg-[#1c1c2e] text-white':'text-zinc-500 hover:text-zinc-200 hover:bg-[#14141c]')}>
        <span>{label}</span>
        {view===id&&<span className="ml-auto w-1.5 h-1.5 rounded-full bg-blue-500"/>}
      </button>))}
      <div className="pt-4">
        <p className="text-[9px] font-bold text-zinc-700 uppercase tracking-widest px-2 mb-2">Deportes</p>
        {SPORTS.map(s=>(<button key={s.id} onClick={()=>setSport(s.id)}
          className={cx('w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs font-medium transition-all',
            sport===s.id?'bg-[#1c1c2e] text-white':'text-zinc-500 hover:text-zinc-200 hover:bg-[#14141c]')}>
          <span>{s.icon}</span><span>{s.label}</span>
          {sport===s.id&&<span className="ml-auto w-1.5 h-1.5 rounded-full" style={{background:s.color}}/>}
        </button>))}
      </div>
    </nav>
    <div className="p-2.5 border-t border-[#191923]">
      <div className="flex items-center gap-2 px-2 py-2 rounded-lg hover:bg-[#14141c] cursor-pointer transition-all">
        <div className="w-7 h-7 rounded-full bg-gradient-to-br from-emerald-400 to-cyan-500 flex items-center justify-center text-[10px] font-bold text-white">CO</div>
        <div className="min-w-0">
          <p className="text-xs font-semibold text-zinc-200">Carlos Ortega</p>
          <p className="text-[9px] text-zinc-500">Head Coach</p>
        </div>
        <span className="ml-auto text-zinc-600 text-sm">⚙</span>
      </div>
    </div>
  </aside>)
}

function TopBar({sport,athletes,selId,onSel}){
  const sp=SPORTS.find(s=>s.id===sport)
  return(<div className="flex items-center justify-between px-5 py-3 border-b border-[#191923] bg-[#0d0d14] shrink-0">
    <div className="flex items-center gap-3">
      <span className="text-lg">{sp?.icon}</span>
      <div>
        <h1 className="text-sm font-bold text-white">{sp?.label}</h1>
        <p className="text-[10px] text-zinc-500">Lun 12 May · Ciclo semana 3/4</p>
      </div>
      <span className="ml-1 text-[10px] text-zinc-500 border border-[#252535] px-2 py-0.5 rounded-full">{athletes.length} atletas</span>
    </div>
    <div className="flex items-center gap-1.5">
      {athletes.map(a=>(<button key={a.id} onClick={()=>onSel(a.id)}
        className={cx('flex items-center gap-1.5 px-2.5 py-1.5 rounded-full text-[11px] font-medium border transition-all',
          selId===a.id?'bg-[#1c1c2e] border-[#3a3a55] text-white':'border-[#1e1e2a] text-zinc-400 hover:border-[#2a2a38] hover:text-zinc-200')}>
        <div className="relative">
          <Av t={a.av} sz="sm"/>
          <span className="absolute -bottom-0.5 -right-0.5 w-2 h-2 rounded-full border border-[#0d0d14]" style={{background:rColor(a.rec)}}/>
        </div>
        {a.name.split(' ')[0]}
      </button>))}
    </div>
  </div>)
}

function HRVCard({ath}){
  if(!ath)return null
  const rc=rColor(ath.rec),hc=ath.hrv>=70?'#60a5fa':ath.hrv>=50?'#fbbf24':'#f87171'
  const msg=ath.rec>=80?'✅ Listo para alta intensidad':ath.rec>=60?'⚠️ Intensidad moderada hoy':'🛑 Recovery bajo — descanso activo'
  return(<Card className="p-5 col-span-2">
    <div className="flex items-center gap-2 mb-4">
      <span className="text-sm">⌚</span>
      <p className="text-[11px] font-semibold text-zinc-300 uppercase tracking-wider">Apple Watch · En vivo</p>
      <span className="ml-auto flex items-center gap-1.5 text-[10px] text-emerald-400 font-medium">
        <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block pdot"/>Sync
      </span>
    </div>
    <div className="flex items-center gap-5">
      <div className="flex gap-4">
        {[{val:ath.rec,c:rc,lbl:'Recovery',u:'%'},{val:ath.hrv,c:hc,lbl:'HRV',u:'ms'}].map((arc,i)=>(
          <div key={i} className="flex flex-col items-center gap-1">
            <div className="relative">
              <Arc val={arc.val} color={arc.c}/>
              <div className="absolute inset-0 flex flex-col items-center justify-center">
                <span className="text-lg font-bold text-white leading-none">{arc.val}</span>
                <span className="text-[8px] text-zinc-500">{arc.u}</span>
              </div>
            </div>
            <p className="text-[10px] text-zinc-400 font-medium">{arc.lbl}</p>
          </div>
        ))}
      </div>
      <div className="flex-1 space-y-2">
        <div className={cx('rounded-lg px-3 py-2 text-xs font-medium border',rBg(ath.rec),rTxt(ath.rec))}>{msg}</div>
        <div className="grid grid-cols-2 gap-2">
          <div className="bg-[#17171f] rounded-lg px-3 py-2">
            <p className="text-[9px] text-zinc-500">FC en reposo</p>
            <div className="flex items-center gap-1 mt-0.5"><span className="text-red-400">♥</span><span className="text-sm font-bold text-white">62 bpm</span></div>
          </div>
          <div className="bg-[#17171f] rounded-lg px-3 py-2">
            <p className="text-[9px] text-zinc-500">Racha activa</p>
            <div className="flex items-center gap-1 mt-0.5"><span>🔥</span><span className="text-sm font-bold text-white">{ath.streak}d</span></div>
          </div>
        </div>
      </div>
    </div>
  </Card>)
}

function GamCard({ath,sport}){
  if(!ath)return null
  const sp=SPORTS.find(s=>s.id===sport),xp=((ath.lvl%100)+20)
  const rIco=ath.rank===1?'🏆':ath.rank===2?'🥈':'🥉'
  return(<Card className="p-5 col-span-3">
    <div className="flex items-start gap-4 mb-3">
      <Av t={ath.av} sz="lg"/>
      <div className="flex-1">
        <div className="flex items-center gap-2">
          <p className="text-sm font-bold text-white">{ath.name}</p>
          <span className={ath.trend==='up'?'text-emerald-400 text-xs':ath.trend==='down'?'text-red-400 text-xs':'text-zinc-500 text-xs'}>{ath.trend==='up'?'↑':ath.trend==='down'?'↓':'—'}</span>
        </div>
        <p className="text-[10px] text-zinc-500">Nivel {ath.lvl} · {ath.sess} sesiones completadas</p>
        <div className="flex items-center gap-2 mt-2">
          <span className="text-[9px] text-zinc-600 shrink-0">Nv {ath.lvl}</span>
          <div className="flex-1 h-1.5 bg-[#1a1a24] rounded-full overflow-hidden">
            <div className="h-full rounded-full transition-all duration-1000" style={{width:`${xp}%`,background:`linear-gradient(90deg,${sp?.color},${sp?.accent})`}}/>
          </div>
          <span className="text-[9px] text-zinc-600 shrink-0">Nv {ath.lvl+1}</span>
        </div>
      </div>
      <div className="text-center shrink-0"><div className="text-xl">{rIco}</div><div className="text-[10px] text-zinc-500">#{ath.rank} deporte</div></div>
    </div>
    <div>
      <p className="text-[10px] text-zinc-500 mb-2">Logros desbloqueados</p>
      <div className="flex gap-1.5 flex-wrap items-center">
        {ath.badges.map((b,i)=>(<span key={i} className="text-base bg-[#1a1a24] border border-[#252535] rounded-lg w-8 h-8 flex items-center justify-center hover:scale-110 transition-transform cursor-default">{b}</span>))}
        <span className="text-[10px] text-zinc-600 ml-1">+{Math.floor(ath.lvl/15)} por desbloquear</span>
      </div>
    </div>
  </Card>)
}

function PerfChart({sport}){
  const sp=SPORTS.find(s=>s.id===sport),c=sp?.color||'#60a5fa'
  return(<Card className="p-5 col-span-3">
    <div className="flex items-center justify-between mb-4">
      <div>
        <h3 className="text-sm font-semibold text-white">Rendimiento · Últimas 8 semanas</h3>
        <p className="text-[10px] text-zinc-500 mt-0.5">Score, carga y recovery</p>
      </div>
      <div className="flex gap-3 text-[10px] text-zinc-500">
        {[{c,l:'Rendimiento'},{c:'#34d399',l:'Recovery'},{c:'#3f3f50',l:'Carga'}].map((x,i)=>(
          <span key={i} className="flex items-center gap-1.5"><span className="w-3 h-1 rounded-full inline-block" style={{background:x.c}}/>{x.l}</span>
        ))}
      </div>
    </div>
    <ResponsiveContainer width="100%" height={170}>
      <AreaChart data={HISTORY} margin={{top:0,right:0,bottom:0,left:-20}}>
        <defs>
          <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="5%" stopColor={c} stopOpacity={0.35}/><stop offset="95%" stopColor={c} stopOpacity={0}/>
          </linearGradient>
          <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="5%" stopColor="#34d399" stopOpacity={0.2}/><stop offset="95%" stopColor="#34d399" stopOpacity={0}/>
          </linearGradient>
        </defs>
        <CartesianGrid strokeDasharray="3 3" stroke="#1a1a24" vertical={false}/>
        <XAxis dataKey="w" tick={{fill:'#52525b',fontSize:10}} axisLine={false} tickLine={false}/>
        <YAxis tick={{fill:'#52525b',fontSize:10}} axisLine={false} tickLine={false} domain={[40,100]}/>
        <Tooltip content={<Tip/>}/>
        <Area type="monotone" dataKey="l" stroke="#3f3f50" fill="none" strokeWidth={1.5} strokeDasharray="4 2" dot={false}/>
        <Area type="monotone" dataKey="r" stroke="#34d399" fill="url(#rg)" strokeWidth={1.5} dot={false}/>
        <Area type="monotone" dataKey="s" stroke={c} fill="url(#sg)" strokeWidth={2} dot={{fill:c,strokeWidth:0,r:3}} activeDot={{r:5,fill:c}}/>
      </AreaChart>
    </ResponsiveContainer>
  </Card>)
}

function Dirs({dirs}){
  const PC={high:{w:'bg-red-500/10 border-red-500/20',lt:'text-red-400',lb:'ALTA'},medium:{w:'bg-yellow-500/10 border-yellow-500/20',lt:'text-yellow-400',lb:'MEDIA'},low:{w:'bg-blue-500/10 border-blue-500/20',lt:'text-blue-400',lb:'OPORTUN.'}}
  return(<Card className="p-5 col-span-2">
    <div className="flex items-center gap-2 mb-4">
      <span>🧠</span>
      <h3 className="text-sm font-semibold text-white">Directrices del Coach</h3>
      <span className="ml-auto text-[10px] text-zinc-500 bg-[#1a1a24] px-2 py-0.5 rounded-full">Hoy</span>
    </div>
    <div className="space-y-2">
      {dirs.map((d,i)=>{const p=PC[d.p]; return(<div key={i} className={cx('rounded-lg border px-3 py-3 cursor-pointer hover:opacity-80 transition-all',p.w)}>
        <div className="flex items-start gap-2">
          <span className="text-base leading-none mt-0.5 shrink-0">{d.icon}</span>
          <div>
            <div className="flex items-center gap-2 mb-1">
              <p className="text-xs font-semibold text-white">{d.t}</p>
              <span className={cx('text-[9px] font-bold tracking-wider',p.lt)}>{p.lb}</span>
            </div>
            <p className="text-[11px] text-zinc-400 leading-relaxed">{d.d}</p>
          </div>
        </div>
      </div>)})}
    </div>
  </Card>)
}

function StatCard({lbl,val,delta,unit,good}){
  const ok=good!==false
  return(<Card className="p-4 col-span-1">
    <p className="text-[10px] font-semibold text-zinc-500 uppercase tracking-wider">{lbl}</p>
    <div className="flex items-end gap-1 mt-1">
      <span className="text-xl font-bold text-white leading-none">{val}</span>
      {unit&&<span className="text-[10px] text-zinc-500 mb-0.5">{unit}</span>}
    </div>
    {delta&&<div className={cx('flex items-center gap-1 text-[10px] font-medium mt-1',ok?'text-emerald-400':'text-red-400')}>{ok?'↑':'↓'} {delta} vs sem.</div>}
  </Card>)
}

function DashboardView({sport}){
  const aths=ATHLETES.filter(a=>a.sport===sport)
  const [selId,setSel]=useState(aths[0]?.id)
  const ath=ATHLETES.find(a=>a.id===selId)
  const m=METRICS[sport]
  useEffect(()=>setSel(ATHLETES.filter(a=>a.sport===sport)[0]?.id),[sport])
  return(<div className="flex flex-col h-full">
    <TopBar sport={sport} athletes={aths} selId={selId} onSel={setSel}/>
    <div className="flex-1 overflow-y-auto p-4 space-y-3 ani">
      <div className="grid grid-cols-4 gap-3">{m.stats.map((s,i)=><StatCard key={i} lbl={s.lbl} val={s.val} delta={s.delta} unit={s.unit} good={s.good}/>)}</div>
      <div className="grid grid-cols-5 gap-3"><HRVCard ath={ath}/><GamCard ath={ath} sport={sport}/></div>
      <div className="grid grid-cols-5 gap-3"><PerfChart sport={sport}/><Dirs dirs={m.dirs}/></div>
    </div>
  </div>)
}

function AthletesView({sport}){
  const aths=ATHLETES.filter(a=>a.sport===sport),sp=SPORTS.find(s=>s.id===sport)
  return(<div className="flex flex-col h-full">
    <div className="px-5 py-4 border-b border-[#191923] bg-[#0d0d14] shrink-0">
      <h1 className="text-sm font-bold text-white">Atletas · {sp?.label}</h1>
      <p className="text-[10px] text-zinc-500">{aths.length} atletas activos en este ciclo</p>
    </div>
    <div className="flex-1 overflow-y-auto p-4 space-y-2.5 ani">
      {aths.map(a=>{const xp=((a.lvl%100)+20); return(<Card key={a.id} className="p-4 cursor-pointer">
        <div className="flex items-center gap-4">
          <div className="relative"><Av t={a.av} sz="lg"/><span className="absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-[#111118]" style={{background:rColor(a.rec)}}/></div>
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-2">
              <p className="text-sm font-semibold text-white">{a.name}</p>
              <span className={a.trend==='up'?'text-emerald-400 text-xs':a.trend==='down'?'text-red-400 text-xs':'text-zinc-500 text-xs'}>{a.trend==='up'?'↑':a.trend==='down'?'↓':'—'}</span>
              <span className="text-[10px] text-zinc-500">{a.sess} sesiones</span>
            </div>
            <div className="flex items-center gap-1.5 mt-1">{a.badges.map((b,i)=><span key={i} className="text-sm">{b}</span>)}<span className="text-[10px] text-zinc-500 ml-1">Racha {a.streak}d 🔥</span></div>
            <div className="flex items-center gap-2 mt-2">
              <span className="text-[9px] text-zinc-600 shrink-0">Nv {a.lvl}</span>
              <div className="flex-1 h-1 bg-[#1a1a24] rounded-full overflow-hidden"><div className="h-full rounded-full" style={{width:`${xp}%`,background:`linear-gradient(90deg,${sp?.color},${sp?.accent})`}}/></div>
              <span className="text-[9px] text-zinc-600 shrink-0">Nv {a.lvl+1}</span>
            </div>
          </div>
          <div className={cx('flex items-center gap-2 px-3 py-2 rounded-lg border text-xs shrink-0',rBg(a.rec),rTxt(a.rec))}>
            <span>⌚</span><div><div className="font-semibold">Recovery {a.rec}%</div><div className="text-[9px] text-zinc-500">HRV {a.hrv}ms</div></div>
          </div>
          <div className="text-center shrink-0"><div className="text-sm font-bold text-zinc-200">#{a.rank}</div><div className="text-[9px] text-zinc-500">rank</div></div>
        </div>
      </Card>)})}
    </div>
  </div>)
}

function SessionsView({sport}){
  const allSess=[
    {id:1,aid:3,date:'Hoy 7:00am',dur:55,int:'Alta',  sc:94,note:'PR en 100m libre. Excelente viraje en fondo. Mejor marca del ciclo.',   hrv:81,kcal:420,ld:72},
    {id:2,aid:1,date:'Hoy 9:30am',dur:70,int:'Media', sc:81,note:'Mejora en primer servicio. Segundo servicio todavía necesita trabajo.',   hrv:72,kcal:380,ld:58},
    {id:3,aid:2,date:'Ayer 5pm',  dur:90,int:'Alta',  sc:61,note:'HRV bajo detectado mid-sesión. Se redujo la carga de manera preventiva.', hrv:45,kcal:610,ld:85},
    {id:4,aid:6,date:'Ayer 5pm',  dur:90,int:'Alta',  sc:88,note:'+0.8km vs semana anterior. Excelente distancia cubierta en partido.',    hrv:74,kcal:720,ld:78},
  ]
  const IC={Alta:'text-red-400 bg-red-500/10 border-red-500/20',Media:'text-yellow-400 bg-yellow-500/10 border-yellow-500/20',Baja:'text-emerald-400 bg-emerald-500/10 border-emerald-500/20'}
  return(<div className="flex flex-col h-full">
    <div className="flex items-center justify-between px-5 py-4 border-b border-[#191923] bg-[#0d0d14] shrink-0">
      <div><h1 className="text-sm font-bold text-white">Sesiones de Entrenamiento</h1><p className="text-[10px] text-zinc-500">Historial y análisis detallado de cada sesión</p></div>
      <button className="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold transition-all">+ Nueva sesión</button>
    </div>
    <div className="flex-1 overflow-y-auto p-4 ani">
      <div className="grid grid-cols-4 gap-3 mb-4">
        {[{ic:'📅',lb:'Esta semana',v:'8',u:'sesiones'},{ic:'⏱️',lb:'Minutos totales',v:'420',u:'min'},{ic:'📈',lb:'Score promedio',v:'78',u:'/100'},{ic:'⚠️',lb:'Alertas HRV',v:'2',u:'atletas'}].map((c,i)=>(
          <Card key={i} className="p-4"><div className="text-xl mb-2">{c.ic}</div><div className="text-xl font-bold text-white">{c.v} <span className="text-xs text-zinc-500 font-normal">{c.u}</span></div><div className="text-[10px] text-zinc-500 mt-0.5">{c.lb}</div></Card>
        ))}
      </div>
      <Card className="p-5">
        <h3 className="text-sm font-semibold text-white mb-4">Sesiones recientes</h3>
        <div className="space-y-3">
          {allSess.map(s=>{const a=ATHLETES.find(x=>x.id===s.aid); return(
            <div key={s.id} className="bg-[#17171f] border border-[#1e1e2a] rounded-lg p-4 hover:border-[#2a2a38] transition-all cursor-pointer">
              <div className="flex items-start gap-3">
                <div className={cx('w-1.5 h-12 rounded-full shrink-0',s.sc>=85?'bg-emerald-400':s.sc>=70?'bg-yellow-400':'bg-red-400')}/>
                <Av t={a?.av||'?'}/>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-1">
                    <p className="text-xs font-semibold text-white">{a?.name}</p>
                    <span className={cx('text-[9px] font-semibold px-1.5 py-0.5 rounded-full border',IC[s.int])}>{s.int}</span>
                    <span className="text-[10px] text-zinc-500">{s.date} · {s.dur}min</span>
                  </div>
                  <p className="text-[11px] text-zinc-400 mb-2">{s.note}</p>
                  <div className="flex gap-4">
                    {[{c:'bg-blue-400',t:`HRV ${s.hrv}ms`},{c:'bg-orange-400',t:`${s.kcal} kcal`},{c:'bg-violet-400',t:`Carga ${s.ld}/100`}].map((x,i)=>(
                      <span key={i} className="flex items-center gap-1 text-[10px] text-zinc-500"><span className={cx('w-1.5 h-1.5 rounded-full inline-block',x.c)}/>{x.t}</span>
                    ))}
                  </div>
                </div>
                <div className="text-right shrink-0"><div className={cx('text-2xl font-bold',sColor(s.sc))}>{s.sc}</div><div className="text-[9px] text-zinc-500">score</div></div>
              </div>
            </div>
          )})}
        </div>
      </Card>
    </div>
  </div>)
}

function RankingView({sport}){
  const sp=SPORTS.find(s=>s.id===sport),spAths=ATHLETES.filter(a=>a.sport===sport)
  return(<div className="flex flex-col h-full">
    <div className="px-5 py-4 border-b border-[#191923] bg-[#0d0d14] shrink-0">
      <h1 className="text-sm font-bold text-white">Ranking Global</h1>
      <p className="text-[10px] text-zinc-500">Basado en consistencia, mejora progresiva y asistencia</p>
    </div>
    <div className="flex-1 overflow-y-auto p-4 ani">
      <div className="grid grid-cols-5 gap-3">
        <Card className="p-5 col-span-3">
          <h3 className="text-sm font-semibold text-white mb-4">Tabla de posiciones</h3>
          <div className="space-y-1.5">
            {LBOARD.map((p,i)=>{
              const pSp=SPORTS.find(s=>s.id===p.sp),isPos=p.d.startsWith('+')
              return(<div key={p.r} className={cx('flex items-center gap-3 px-3 py-3 rounded-lg transition-all',
                i===0?'bg-gradient-to-r from-yellow-500/10 to-transparent border border-yellow-500/20':'bg-[#17171f] hover:bg-[#1c1c27] cursor-pointer')}>
                <span className="text-base w-6 text-center">{p.ico}</span>
                <Av t={p.n.split(' ').map(x=>x[0]).join('')} sz="sm"/>
                <div className="flex-1 min-w-0"><p className="text-xs font-semibold text-white">{p.n}</p><p className="text-[10px] text-zinc-500">{pSp?.icon} {pSp?.label}</p></div>
                <span className={cx('text-[10px] font-medium',isPos?'text-emerald-400':'text-red-400')}>{isPos?'↑':'↓'}{p.d}</span>
                <div className="text-right"><div className="text-sm font-bold text-white">{p.pts.toLocaleString()}</div><div className="text-[9px] text-zinc-500">pts</div></div>
              </div>)
            })}
          </div>
        </Card>
        <div className="col-span-2 space-y-3">
          {spAths.length>=1&&(<Card className="p-5">
            <h3 className="text-xs font-semibold text-white mb-1">Radar de habilidades</h3>
            <p className="text-[10px] text-zinc-500 mb-3">Top 2 atletas · {sp?.label}</p>
            <ResponsiveContainer width="100%" height={190}>
              <RadarChart data={RADAR}>
                <PolarGrid stroke="#1e1e2a"/>
                <PolarAngleAxis dataKey="a" tick={{fill:'#52525b',fontSize:9}}/>
                <Radar dataKey="A" stroke={sp?.color} fill={sp?.color} fillOpacity={0.15} strokeWidth={1.5}/>
                <Radar dataKey="B" stroke="#8b5cf6" fill="#8b5cf6" fillOpacity={0.1} strokeWidth={1.5}/>
              </RadarChart>
            </ResponsiveContainer>
            <div className="flex justify-center gap-4">
              {spAths.slice(0,2).map((a,i)=>(<div key={a.id} className="flex items-center gap-1.5 text-[10px] text-zinc-400"><span className="w-3 h-1 rounded-full inline-block" style={{background:i===0?sp?.color:'#8b5cf6'}}/>{a.name.split(' ')[0]}</div>))}
            </div>
          </Card>)}
          <Card className="p-4">
            <h3 className="text-xs font-semibold text-white mb-3">🏅 Próximos logros</h3>
            <div className="space-y-3">
              {[{ic:'🔥',n:'Racha 30 días',w:'Sofía · 16 días restantes',p:47},{ic:'⚡',n:'50 sesiones',w:'Valentina · 9 sesiones',p:82},{ic:'🎯',n:'PR personal',w:'Diego · próxima semana',p:65}].map((m,i)=>(
                <div key={i}>
                  <div className="flex items-center gap-2 mb-1">
                    <span className="text-sm">{m.ic}</span>
                    <div className="flex-1"><p className="text-[11px] font-medium text-white">{m.n}</p><p className="text-[9px] text-zinc-500">{m.w}</p></div>
                    <span className="text-[10px] font-bold text-zinc-300">{m.p}%</span>
                  </div>
                  <div className="h-1 bg-[#1a1a24] rounded-full overflow-hidden ml-6"><div className="h-full rounded-full bg-gradient-to-r from-blue-500 to-violet-500" style={{width:`${m.p}%`}}/></div>
                </div>
              ))}
            </div>
          </Card>
        </div>
      </div>
    </div>
  </div>)
}

function App(){
  const [view,setView]=useState('dashboard')
  const [sport,setSport]=useState('tennis')
  const handleSport=s=>{setSport(s);setView('dashboard')}
  const V={dashboard:DashboardView,athletes:AthletesView,sessions:SessionsView,ranking:RankingView}
  const View=V[view]||DashboardView
  return(<div className="flex h-screen overflow-hidden bg-[#09090e]">
    <Sidebar view={view} setView={setView} sport={sport} setSport={handleSport}/>
    <main className="flex-1 flex flex-col min-w-0 overflow-hidden"><View sport={sport}/></main>
  </div>)
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script>
</body>
</html>
